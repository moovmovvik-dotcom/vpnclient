<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>blowvpn — VPN Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f1e 0%, #1a1f3a 100%);
            color: #e0e0e0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .section {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .section h2 {
            font-size: 20px;
            margin-bottom: 16px;
            color: #00d4ff;
        }

        .form-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        input[type="text"],
        input[type="url"],
        textarea {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="url"]:focus,
        textarea:focus {
            outline: none;
            background: rgba(0,0,0,0.5);
            border-color: rgba(0,212,255,0.5);
            box-shadow: 0 0 12px rgba(0,212,255,0.2);
        }

        button {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            border: none;
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,212,255,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: rgba(255,255,255,0.1);
            color: #00d4ff;
            border: 1px solid rgba(0,212,255,0.3);
        }

        button.secondary:hover {
            background: rgba(0,212,255,0.1);
            border-color: rgba(0,212,255,0.6);
        }

        .server-list {
            display: grid;
            gap: 12px;
        }

        .server-card {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .server-card:hover {
            background: rgba(0,0,0,0.6);
            border-color: rgba(0,212,255,0.3);
            transform: translateX(4px);
        }

        .server-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .server-name {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .server-flag {
            font-size: 20px;
        }

        .server-protocol {
            display: inline-block;
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .server-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            font-size: 13px;
            color: #888;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            color: #666;
            font-size: 11px;
            text-transform: uppercase;
        }

        .stat-value {
            color: #00d4ff;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0,212,255,0.2);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(255,100,100,0.1);
            border: 1px solid rgba(255,100,100,0.3);
            color: #ff6464;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .success {
            background: rgba(100,255,100,0.1);
            border: 1px solid rgba(100,255,100,0.3);
            color: #64ff64;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .traffic-bar {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            height: 6px;
            overflow: hidden;
            margin-top: 4px;
        }

        .traffic-used {
            background: linear-gradient(90deg, #00d4ff, #0099ff);
            height: 100%;
            transition: width 0.3s ease;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .tab {
            padding: 12px 16px;
            border: none;
            background: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 blowvpn</h1>
            <p class="subtitle">VPN-клиент для управления подписками • VLESS • VMess • Shadowsocks • Trojan</p>
        </header>

        <div class="tabs">
            <button class="tab active" data-tab="subscriptions">Подписки</button>
            <button class="tab" data-tab="servers">Серверы</button>
        </div>

        <!-- Subscriptions Tab -->
        <div id="subscriptions" class="tab-content active">
            <div class="section">
                <h2>➕ Добавить подписку</h2>
                <div class="form-group">
                    <input type="url" id="subscriptionUrl" placeholder="Вставьте ссылку на подписку..." />
                    <button onclick="addSubscription()">Загрузить</button>
                </div>
                <div id="message"></div>
            </div>

            <div class="section">
                <h2>📋 Мои подписки</h2>
                <div id="subscriptionsList" class="server-list">
                    <div class="empty">Нет активных подписок</div>
                </div>
            </div>
        </div>

        <!-- Servers Tab -->
        <div id="servers" class="tab-content">
            <div class="section">
                <h2>🖥️ Доступные серверы</h2>
                <div id="serversList" class="server-list">
                    <div class="empty">Загрузите подписку, чтобы увидеть серверы</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let subscriptions = [];
        let servers = [];

        // Load data from localStorage
        function loadData() {
            const saved = localStorage.getItem('vpn-data');
            if (saved) {
                const data = JSON.parse(saved);
                subscriptions = data.subscriptions || [];
                servers = data.servers || [];
                renderSubscriptions();
                renderServers();
            }
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('vpn-data', JSON.stringify({ subscriptions, servers }));
        }

        // Add subscription
        async function addSubscription() {
            const url = document.getElementById('subscriptionUrl').value.trim();
            const messageEl = document.getElementById('message');

            if (!url) {
                showMessage('Укажите URL подписки', 'error');
                return;
            }

            messageEl.innerHTML = '<div class="loading"><div class="spinner"></div>Загрузка...</div>';

            try {
                const response = await fetch('/api/subscription/fetch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Ошибка загрузки подписки');
                }

                // Add subscription
                const sub = {
                    id: 'sub-' + Date.now(),
                    url,
                    added: new Date().toLocaleString('ru-RU'),
                    trafficUsed: data.trafficUsed || 0,
                    trafficTotal: data.trafficTotal,
                    expiresAt: data.expiresAt
                };

                subscriptions.push(sub);
                servers.push(...data.servers);
                saveData();
                renderSubscriptions();
                renderServers();

                document.getElementById('subscriptionUrl').value = '';
                showMessage(`✅ Подписка добавлена! ${data.servers.length} серверов загружено`, 'success');
            } catch (error) {
                console.error(error);
                showMessage(`❌ ${error.message}`, 'error');
            }
        }

        // Show message
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => {
                messageEl.innerHTML = '';
            }, 5000);
        }

        // Render subscriptions
        function renderSubscriptions() {
            const list = document.getElementById('subscriptionsList');

            if (subscriptions.length === 0) {
                list.innerHTML = '<div class="empty">Нет активных подписок</div>';
                return;
            }

            list.innerHTML = subscriptions.map(sub => `
                <div class="server-card">
                    <div class="server-header">
                        <div class="server-name">🔗 ${sub.url.substring(0, 50)}...</div>
                        <button class="secondary" style="font-size: 12px; padding: 6px 12px;" onclick="removeSubscription('${sub.id}')">Удалить</button>
                    </div>
                    <div class="server-stats">
                        <div class="stat-item">
                            <span class="stat-label">Трафик</span>
                            <span class="stat-value">${sub.trafficUsed}/${sub.trafficTotal || '∞'} GB</span>
                            ${sub.trafficTotal ? `<div class="traffic-bar"><div class="traffic-used" style="width: ${(sub.trafficUsed / sub.trafficTotal * 100)}%"></div></div>` : ''}
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Добавлена</span>
                            <span class="stat-value">${sub.added}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Статус</span>
                            <span class="stat-value" style="color: #64ff64;">✓ Активна</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Remove subscription
        function removeSubscription(id) {
            if (confirm('Удалить подписку?')) {
                subscriptions = subscriptions.filter(s => s.id !== id);
                saveData();
                renderSubscriptions();
                showMessage('✅ Подписка удалена', 'success');
            }
        }

        // Render servers
        function renderServers() {
            const list = document.getElementById('serversList');

            if (servers.length === 0) {
                list.innerHTML = '<div class="empty">Загрузите подписку, чтобы увидеть серверы</div>';
                return;
            }

            list.innerHTML = servers.map(srv => `
                <div class="server-card">
                    <div class="server-header">
                        <div class="server-name">
                            <span class="server-flag">${srv.flag}</span>
                            ${srv.country}${srv.city ? ' • ' + srv.city : ''}
                        </div>
                        <span class="server-protocol">${srv.protocol}</span>
                    </div>
                    <div class="server-stats">
                        <div class="stat-item">
                            <span class="stat-label">Пинг</span>
                            <span class="stat-value">${srv.ping}ms</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Протокол</span>
                            <span class="stat-value">${srv.protocol}</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">Статус</span>
                            <span class="stat-value" style="color: #64ff64;">✓ Готов</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                const tabName = e.target.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });

        // Initialize
        loadData();
    </script>
</body>
</html>
